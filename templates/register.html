<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="login-box">

        <h2>Create Account</h2>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form action="{{ url_for('register_user') }}" method="POST">

            <div class="input-box">
                <input
                    type="text"
                    name="username"
                    placeholder="Full Name"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    minlength="6"
                    required>
            </div>

            <div class="input-box">
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    minlength="6"
                    required>
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</body>
</html>
